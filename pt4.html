<!DOCTYPE html>
<html>
<head>
<title>Student Result Calculator</title>

<style>
body{
    font-family: Arial;
    background-color:#0c0c0c;
    text-align:center;
}

.container{
    background:rgb(131, 126, 126);
    width:400px;
    margin:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

input,button{
    padding:8px;
    margin:8px;
}

button{
    background-color:green;
    color:white;
    border:none;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Student Result Calculator</h2>

<label>Enter Number of Subjects:</label>
<br>
<input type="number" id="subjects">
<br>

<button onclick="calculateResult()">Calculate Result</button>

<div id="result"></div>

</div>

<script>

function calculateResult(){

let n = document.getElementById("subjects").value;
let total = 0;
let pass = true;

for(let i=1; i<=n; i++){

    let marks = prompt("Enter marks for Subject " + i);

    marks = Number(marks);

    total = total + marks;

    if(marks < 40){
        pass = false;
    }

}

let average = total / n;
let grade;

if(average >= 90){
    grade = "A+";
}
else if(average >= 75){
    grade = "A";
}
else if(average >= 60){
    grade = "B";
}
else if(average >= 50){
    grade = "C";
}
else{
    grade = "D";
}

let result = pass ? "PASS" : "FAIL";

document.getElementById("result").innerHTML =
"Total Marks: " + total + "<br>" +
"Average Marks: " + average.toFixed(2) + "<br>" +
"Grade: " + grade + "<br>" +
"Result: " + result;

}

</script>

</body>
</html>
