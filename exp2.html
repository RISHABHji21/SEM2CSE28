<body>

      <div id="output"></div>
    </div>
    <script>
function addEmpolyee(){
    let name = document.getElementbyid("name").value;
    let empid = document.getElementbyid("empid").value;
    let salary = parseFloat(document.getElementbyid("salary").value);
    let dept = document.getElementbyid("dept").value;
    if (name === " " || empid === "" || isNaN(salary) || dept === "") {
        alert("Please fill in all fields correctly.");
        return;
    }
    let employee = {
        name: name,
        id: empid,
        salary: salary,
        department: dept
        employees.push(employee);
        alert("Employee added successfully!");
        document.getElementById("name").value = "";
        document.getElementById("empid").value = "";
        document.getElementById("salary").value = "";
        document.getElementById("dept").value = "";
    }
    function displayEmployees() {
        let output = "<h3> all employees list </h2>";
            
        for (let i = 0; i < employees.length; i++) {
            output += "<li>" + employees[i].name + " - ID: " + employees[i].id + " - Salary: $" + employees[i].salary.toFixed(2) + " - Department: " + employees[i].department + "</li>";
        }
        output += "</ul>";
        document.getElementById("output").innerHTML = output;
    }
    </script>
